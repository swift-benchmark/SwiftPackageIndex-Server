name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      languages:
        description: 'Languages to analyze'
        required: true
        default: 'swift'

jobs:
  analyze:
    name: Analyze
    runs-on: macos-latest
    permissions:
      contents: write
      security-events: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Dependency resolution must run OUTSIDE the tracer. Under CodeQL's preload_tracer the
      # SwiftPM shared repository cache is unreachable and every dependency dies with
      # "cannot change to ~/Library/Caches/org.swift.swiftpm/repositories/<dep>: No such file
      # or directory", which is what broke the 2026-09-14 run.
      - name: Resolve SwiftPM dependencies
        run: swift package resolve

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ github.event.inputs.languages || 'swift' }}
          build-mode: manual

      # Explicit build instead of autobuild: once the root build fails, autobuild walks into
      # sub-directories and trips on Sources/App/Models/Package.swift, a Fluent model named
      # Package, not a manifest.
      - name: Build
        run: swift build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ github.event.inputs.languages || 'swift' }}"
